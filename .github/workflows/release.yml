name: Publish macOS app

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v1.0.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check version and architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(uname -m)" == arm64 ]]
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$version" ]]
          test -f "docs/releases/$RELEASE_TAG.md"

      - name: Run core checks
        run: bash scripts/test.sh

      - name: Build Apple Silicon app
        run: bash scripts/build.sh

      - name: Publish downloadable app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="Qingfeng-${version}-AppleSilicon.zip"
          [[ "$(lipo -archs dist/清风.app/Contents/MacOS/Qingfeng)" == arm64 ]]
          (cd dist && shasum -a 256 "$asset" > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > dist/release-is-draft.txt 2>/dev/null; then
            [[ "$(cat dist/release-is-draft.txt)" == true ]] || { echo 'This version is already published.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Qingfeng $version" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" "dist/$asset" dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
